<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Для Ксюши</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Marck+Script&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; background: #0b0306; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  button {
    position: fixed; right: 16px; bottom: 16px;
    font: 13px Montserrat, Arial, sans-serif; color: #fff4f7;
    background: rgba(255,110,150,.12); border: 1px solid rgba(255,110,150,.35);
    border-radius: 20px; padding: 8px 14px; cursor: pointer;
  }
  button:hover { background: rgba(255,110,150,.25); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="again">Сначала</button>
 
<script>
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
 

var lay = document.createElement('canvas'), lctx = lay.getContext('2d');
var tx = document.createElement('canvas'), txc = tx.getContext('2d');
var gl = document.createElement('canvas'), gctx = gl.getContext('2d');
var sm1 = document.createElement('canvas'), sm1c = sm1.getContext('2d');
var sm2 = document.createElement('canvas'), sm2c = sm2.getContext('2d');
 
var TEXT = ['Ксюша,', 'я люблю тебя<3'];

var PHRASES = ['I love you', 'I love you', 'love you', 'love you', 'Love you',
               'LOVE YOU', 'LOVE YOU', 'LOVE YOU', 'I LOVE YOU', 'I LOVE YOU'];
var COLORS = ['255,60,95', '255,60,95', '255,60,95', '255,92,135', '255,92,135',
              '255,92,135', '255,92,135', '255,135,175', '255,135,175', '255,135,175', '255,200,215'];
var SANS = '"Montserrat", Arial, sans-serif';
var SCRIPT = '"Marck Script", "Segoe Script", cursive';
 

var BUILD = 420;
var ZOOM1 = 440, ZOOM2 = 620;
var BOOM = 640;
var FADE = 170;
var TEXT1 = BOOM + 90, TEXT2 = BOOM + 200;
var LINE1 = BOOM + 210, LINE2 = BOOM + 360;
var ZOOM = 1.12;
 
var W, H, unit, words = [], t0, last, raf;
 
function rnd(a, b) { return a + Math.random() * (b - a); }
function smooth(x) { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }
 
function textWidth(t, fs) {
  lctx.font = '700 ' + fs + 'px ' + SANS;
  return lctx.measureText(t).width;
}

function inHeart(x, y) {
  return Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y <= 0;
}

function heartRuns(y) {
  var runs = [], start = null;
  for (var x = -1.3; x <= 1.3; x += 0.002) {
    var inside = inHeart(x, y);
    if (inside && start === null) start = x;
    if (!inside && start !== null) { runs.push([start, x]); start = null; }
  }
  if (start !== null) runs.push([start, 1.3]);
  return runs;
}
 

function fillRow(xl, xr, fs) {
  var best = null;
  for (var tries = 0; tries < 14; tries++) {
    var items = [], sum = 0;
    while (true) {
      var t = PHRASES[Math.floor(Math.random() * PHRASES.length)];
      var w = textWidth(t, fs);
      if (sum + w + items.length * fs * 1.6 > xr - xl) break;
      items.push({ t: t, w: w });
      sum += w;
    }
    if (!items.length) continue;
    var left = xr - xl - sum - (items.length - 1) * fs * 1.6;
    if (!best || left < best.left) best = { items: items, sum: sum, left: left };
    if (left < fs * 0.6) break;
  }
  if (!best) return [];
 
  var n = best.items.length;
  var gap = n > 1 ? (xr - xl - best.sum) / (n - 1) : 0;
  var x = n > 1 ? xl : xl + (xr - xl - best.sum) / 2;
  var out = [];
  for (var i = 0; i < n; i++) {
    out.push({ t: best.items[i].t, x: x + best.items[i].w / 2, edge: i == 0 || i == n - 1 });
    x += best.items[i].w + gap;
  }
  return out;
}
 
function makeWords() {
  words = [];
  var S = 350, c = 500;
  var top = c - 1.19 * S, bottom = c + 1.11 * S;
  var row = 0;
 
  for (var y = top + 10; y < bottom; y += 20) {
    var fs = (row++ % 3 == 1) ? 15 : 14;
    var ny = -(y - c) / S + 0.11;
    var rise = 1 - (y - top) / (bottom - top);
    var runs = heartRuns(ny);
 
    for (var r = 0; r < runs.length; r++) {
      var xl = c + runs[r][0] * S + fs, xr = c + runs[r][1] * S - fs;
      if (xr - xl < textWidth('love you', fs) * 0.9) continue;
      var line = fillRow(xl, xr, fs);
 
      for (var i = 0; i < line.length; i++) {
        var it = line[i];

        var delay = it.edge
          ? (it.x < c ? rise * 0.5 : 0.5 + rise * 0.5) * (BUILD - 90) + rnd(0, 25)
          : rnd(0.2, 1) * (BUILD - 60);
        words.push({
          t: it.t, x: it.x, y: y, fs: fs,
          col: COLORS[Math.floor(Math.random() * COLORS.length)],
          base: it.edge ? 1 : rnd(0.55, 0.85),
          delay: delay, a: 0, ph: rnd(0, 6.28),

          ang: Math.atan2(y - c, it.x - c) + rnd(-0.4, 0.4),
          spd: rnd(5, 10) * (0.55 + Math.hypot(it.x - c, y - c) / 330),
          rot: rnd(-0.04, 0.04)
        });
      }
    }
  }
}
 
function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.round(innerWidth * dpr);
  H = Math.round(innerHeight * dpr);
  [cv, lay, tx, gl].forEach(function (c) { c.width = W; c.height = H; });
  sm1.width = W >> 2; sm1.height = H >> 2;
  sm2.width = W >> 3; sm2.height = H >> 3;
  unit = Math.min(W, H) / 1000;
}
 

function blur(src) {
  sm1c.drawImage(src, 0, 0, sm1.width, sm1.height);
  sm2c.drawImage(sm1, 0, 0, sm2.width, sm2.height);
  gctx.drawImage(sm2, 0, 0, W, H);
}
 
function outline(f, cx, cy) {
  if (f < LINE1) return;
  var p = smooth((f - LINE1) / (LINE2 - LINE1));
  var k = Math.min(W, H) * 0.95 / 32;
  var y0 = cy - 2.5 * k;
 
  ctx.save();
  ctx.globalAlpha = p < 1 ? 1 : 0.8 + 0.2 * Math.sin(f * 0.05);
  ctx.strokeStyle = 'rgb(255,120,160)';
  ctx.lineWidth = Math.max(2, 3.2 * unit);
  ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(255,70,120,0.95)';
  ctx.shadowBlur = 22 * unit;
 

  [1, -1].forEach(function (side) {
    ctx.beginPath();
    var end = Math.max(1, Math.round(160 * p));
    for (var i = 0; i <= end; i++) {
      var t = Math.PI - side * Math.PI * i / 160;
      var x = cx + 16 * Math.pow(Math.sin(t), 3) * k;
      var y = y0 - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * k;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.stroke();
  });
  ctx.restore();
}
 
function draw(f, dt) {
  var cx = W / 2, cy = H / 2;
 

  var zt = smooth((f - ZOOM1) / (ZOOM2 - ZOOM1));
  var beat = 1 + 0.018 * Math.pow(Math.max(0, Math.sin(f * 0.08)), 3) * (1 - zt);
  var zz = (1 + (ZOOM - 1) * zt) * beat;
  var dim = 1 - 0.35 * zt;
  var e = f - BOOM;
 
  lctx.fillStyle = '#000';
  lctx.fillRect(0, 0, W, H);
  lctx.textAlign = 'center';
  lctx.textBaseline = 'middle';
 
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    if (f > w.delay && w.a < 1) w.a = Math.min(1, w.a + (0.05 + Math.random() * 0.03) * dt);
    if (w.a <= 0) continue;
    if (e > FADE) continue;
 

    var flick = w.a >= 1 ? 0.72 + 0.28 * Math.sin(f * 0.04 + w.ph * 3) : 0.85 + 0.15 * Math.random();
    var a = w.a * w.base * flick * dim;
    var dx = (w.x - 500) * zz, dy = (w.y - 500) * zz, rot = 0, size = 1;
 
    if (e > 0) {

      var d = w.spd * (1 - Math.exp(-e * 0.03)) / 0.03;
      dx += Math.cos(w.ang) * d;
      dy += Math.sin(w.ang) * d + 0.006 * e * e;
      rot = w.rot * e;
      size = 1 + e * 0.004;
      a = Math.min(1, a * (1 + 1.6 * Math.exp(-e * 0.07))) * Math.pow(1 - e / FADE, 1.3);
    }
 
    var fs = Math.max(8, Math.round(w.fs * unit * zz * size));
    var x = cx + dx * unit + Math.sin(f * 0.02 + w.ph) * 1.5 * unit;
    var y = cy + dy * unit + Math.cos(f * 0.017 + w.ph) * 1.5 * unit;
 
    lctx.save();
    lctx.translate(x, y);
    lctx.rotate(rot);
    lctx.font = '700 ' + fs + 'px ' + SANS;
    var sw = lctx.measureText(w.t).width;
 
    lctx.font = '500 ' + Math.round(fs * 1.35) + 'px ' + SANS;
    lctx.fillStyle = 'rgba(255,70,110,' + a * 0.38 + ')';
    lctx.fillText(w.t[0], -(sw / 2 + fs * 0.6), 0);
    lctx.fillText(w.t[w.t.length - 1], sw / 2 + fs * 0.6, 0);
 
    lctx.font = '700 ' + fs + 'px ' + SANS;
    lctx.fillStyle = 'rgba(' + w.col + ',' + a + ')';
    lctx.fillText(w.t, 0, 0);
    lctx.restore();
  }
 
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#0b0306';
  ctx.fillRect(0, 0, W, H);
  blur(lay);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.6;
  ctx.drawImage(gl, 0, 0);
  ctx.drawImage(gl, 0, 0);
  ctx.globalAlpha = 1;
  ctx.drawImage(lay, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
 

  if (f > TEXT1) {
    var t = smooth((f - TEXT1) / (TEXT2 - TEXT1));
    var bd = t * (1 - smooth((f - BOOM - 160) / 90));
    var g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(W, H) / 2);
    g.addColorStop(0, 'rgba(11,3,6,' + 0.93 * bd + ')');
    g.addColorStop(0.55, 'rgba(11,3,6,' + 0.6 * bd + ')');
    g.addColorStop(1, 'rgba(11,3,6,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
 
    var fs2 = Math.round(115 * unit);
    txc.font = '400 ' + fs2 + 'px ' + SCRIPT;
    var widest = Math.max(txc.measureText(TEXT[0]).width, txc.measureText(TEXT[1]).width);
    var maxW = Math.min(Math.min(W, H) * 0.62, W * 0.9);
    if (widest > maxW) fs2 = Math.floor(fs2 * maxW / widest);
 
    var lh = fs2 * 1.2, lift = Math.min(W, H) * 0.1;
    var ys = [cy - lh * 0.55 - lift, cy + lh * 0.55 - lift];
 
    txc.fillStyle = '#000';
    txc.fillRect(0, 0, W, H);
    txc.font = '400 ' + fs2 + 'px ' + SCRIPT;
    txc.textAlign = 'center';
    txc.textBaseline = 'middle';
    txc.fillStyle = 'rgb(255,110,150)';
    txc.fillText(TEXT[0], cx, ys[0]);
    txc.fillText(TEXT[1], cx, ys[1]);
    blur(tx);
 
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = (0.8 + 0.12 * Math.sin(f * 0.05)) * t;
    ctx.drawImage(gl, 0, 0);
 
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = t;
    ctx.fillStyle = '#fff4f7';
    ctx.font = '400 ' + fs2 + 'px ' + SCRIPT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(TEXT[0], cx, ys[0]);
    ctx.fillText(TEXT[1], cx, ys[1]);
    ctx.globalAlpha = 1;
  }
 
  outline(f, cx, cy);
}
 
function loop(now) {
  var f = (now - t0) * 0.06;
  var dt = Math.min(4, f - last);
  last = f;
  draw(f, dt);
  raf = requestAnimationFrame(loop);
}
 
function start() {
  cancelAnimationFrame(raf);
  resize();
  makeWords();
  t0 = performance.now();
  last = 0;
  raf = requestAnimationFrame(loop);
}
 
document.getElementById('again').onclick = start;
window.onresize = resize;
document.onkeydown = function (ev) {
  if (ev.key == 'r' || ev.key == 'R') start();
};
 

var started = false;
function go() { if (!started) { started = true; start(); } }
Promise.all([
  document.fonts.load('700 14px Montserrat'),
  document.fonts.load('400 60px "Marck Script"', 'Ксюша')
]).then(go, go);
setTimeout(go, 2500);
</script>
</body>
</html>
